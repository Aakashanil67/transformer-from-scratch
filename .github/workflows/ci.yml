name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements/constraints-cpu.txt -e '.[all]'
      - run: python -m ruff format --check src tests scripts app
      - run: python -m ruff check src tests scripts app
      - run: python -m pytest --cov=transformer_lab --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python -m pip check
      - run: python scripts/render_results.py --results reports/results --output reports/generated-results.md --check
      - run: python scripts/render_results.py --results reports/results/v3 --output reports/generated-results-v3.md --check
      - run: python scripts/verify_install.py --wheel "$(find dist -name '*.whl' -print -quit)"

  linux-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements/constraints-cpu.txt -e '.[all]'
      - run: python -m pytest -q

  windows-py312:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c requirements/constraints-cpu.txt -e ".[all]"
      - run: python -m pytest -q
